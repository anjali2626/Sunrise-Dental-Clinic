<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sunrise Dental Clinic</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

<div class="login-page">


    <section class="login-brand-panel">

        <div class="brand-content">

            <div class="brand-logo">
                🦷
            </div>

            <h1><i>Sunrise Dental Clinic</i></h1>
			
			<div class="login-card">

			    <br>        
				<h2>Welcome back</h2>

			            <p class="login-subtitle">
			                Sign in to access the clinic management system.
			            </p>

			            <div id="loginMessage"></div>

			            <form id="loginForm" class="login-form">

			                <div class="form-group">

			                    <label class="form-label">
			                        Username
			                    </label>

			                    <input
			                        type="text"
			                        id="username"
			                        class="form-control"
			                        placeholder="Enter your username"
			                        autocomplete="username">

			                </div>

			                <div class="form-group">

			                    <label class="form-label">
			                        Password
			                    </label>

			                    <div class="password-wrapper">

			                        <input
			                            type="password"
			                            id="password"
			                            class="form-control"
			                            placeholder="Enter your password"
			                            autocomplete="current-password">

			                        <button
			                            type="button"
			                            class="toggle-password"
			                            id="togglePassword">
			                            👁
			                        </button>

			                    </div>

			                </div>

			                <button
			                    type="submit"
			                    class="btn btn-primary login-button">

			                    Sign In

			                </button>

			            </form>

			            <div class="login-footer">
			                Sunrise Dental Clinic Management System   |   Secure Staff Portal
			            </div>

			        </div>

        </div>

    </section>

    <section class="login-panel"></section>
	

</div>

<script src="../js/validation.js"></script>
<script src="../js/auth.js"></script>

</body>
</html>
